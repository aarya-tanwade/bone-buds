<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc"><title id="title">T01 wiring</title><desc id="desc">5 volts to VIN, ESP32 3V3 to SD, common ground, GPIO26 BCLK, GPIO25 LRC, GPIO22 DIN. BCT across SPK plus and minus.</desc><rect width="1000" height="760" rx="18" fill="#f5f7fa"/><g font-family="Segoe UI,Arial,sans-serif" fill="#142737"><text x="40" y="50" font-size="26" font-weight="600">T01 / Bench connections</text><text x="40" y="85" font-size="20">USB powers ESP32 · One transducer · Power off before wiring</text><rect x="40" y="120" width="275" height="445" rx="10" fill="white" stroke="#b7c8d7"/><rect x="685" y="120" width="275" height="445" rx="10" fill="white" stroke="#b7c8d7"/><text x="65" y="160" font-size="23" font-weight="600">ESP32-WROOM-32</text><text x="710" y="160" font-size="23" font-weight="600">MAX98357A</text><text x="65" y="222" font-size="22">5V supply</text><text x="710" y="222" font-size="22">VIN</text><path d="M315 215H685" stroke="#9c643d" stroke-width="3"/><text x="500" y="205" text-anchor="middle" font-size="18" fill="#9c643d">5 V power</text><text x="65" y="277" font-size="22">3V3</text><text x="710" y="277" font-size="22">SD</text><path d="M315 270H685" stroke="#85539a" stroke-width="3"/><text x="500" y="260" text-anchor="middle" font-size="18" fill="#85539a">Enable / mode</text><text x="65" y="332" font-size="22">GND</text><text x="710" y="332" font-size="22">GND</text><path d="M315 325H685" stroke="#526779" stroke-width="3"/><text x="500" y="315" text-anchor="middle" font-size="18" fill="#526779">Common ground</text><text x="65" y="387" font-size="22">GPIO26</text><text x="710" y="387" font-size="22">BCLK</text><path d="M315 380H685" stroke="#3979af" stroke-width="3"/><text x="500" y="370" text-anchor="middle" font-size="18" fill="#3979af">I²S bit clock</text><text x="65" y="442" font-size="22">GPIO25</text><text x="710" y="442" font-size="22">LRC / WS</text><path d="M315 435H685" stroke="#3979af" stroke-width="3"/><text x="500" y="425" text-anchor="middle" font-size="18" fill="#3979af">I²S word select</text><text x="65" y="497" font-size="22">GPIO22</text><text x="710" y="497" font-size="22">DIN</text><path d="M315 490H685" stroke="#3979af" stroke-width="3"/><text x="500" y="480" text-anchor="middle" font-size="18" fill="#3979af">I²S data</text><text x="710" y="540" font-size="19">GAIN: unconnected</text><rect x="55" y="605" width="280" height="95" rx="10" fill="white" stroke="#b7c8d7"/><text x="80" y="660" font-size="24">Single BCT</text><path d="M335 635H750V565M335 675H900V565" stroke="#3979af" stroke-width="3" fill="none"/><text x="760" y="600" font-size="20">SPK+</text><text x="910" y="625" font-size="20">SPK−</text><text x="370" y="735" font-size="20">Neither speaker output connects to ground.</text></g></svg>